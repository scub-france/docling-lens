[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "SIM",
  "TCH",
  "RUF",
]
ignore = [
  "E501",
  "B008",
  "N815",
  "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["api", "domain", "infra"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
